<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Seite nicht gefunden</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            text-align: center;
            padding: 40px;
            max-width: 700px;
        }

        .error-code {
            font-size: 8em;
            font-weight: bold;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #00d9ff;
        }

        .message {
            font-size: 1.2em;
            color: #94a3b8;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .home-button {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid #9d4edd;
            box-shadow: 0 5px 20px rgba(168, 85, 247, 0.3);
        }

        .home-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(168, 85, 247, 0.5);
        }

        .icon {
            font-size: 4em;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="icon">🔍</div>
    <div class="error-code">404</div>
    <h1>Seite nicht gefunden</h1>
    <p class="message">
        Die angeforderte Seite existiert leider nicht.<br>
        Vielleicht wurde sie gelöscht oder die URL ist falsch.
    </p>
    <a href="/" class="home-button">⬅ Zurück zur Startseite</a>
</div>
</body>
</html>
